license = "MIT"
license-files = [
    "LICENSE",
]

[build-system]
requires = [
    "setuptools==84.2.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "docassemble.SLSCT"
version = "0.0.1"
description = "A docassemble extension."
readme = "README.md"
authors = [
    { name = "Jim Graszer", email = "jim@lemmalegal.com" },
]
dependencies = ["docassemble.AssemblyLine", "docassemble.WorkflowDocs @ git+https://github.com/LemmaLegalConsulting/docassemble-WorkflowDocs.git@98902b752b72f360fb017902225a8dd46d0c4eb5"]

[project.urls]
Homepage = "https://docassemble.org"

[tool.setuptools.packages.find]
where = [
    ".",
]
