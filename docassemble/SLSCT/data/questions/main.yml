id: welcome
question: |
  Bankruptcy Pro Bono Service Application
subquestion: |
  The Connecticut Bar Association Commercial Law and Bankruptcy Section offers volunteer attorneys to represent qualified individuals or married couples in Chapter 7 bankruptcy cases or adversary proceedings at no cost.

  #### To be considered for pro bono counsel, you must:

  1. Have attempted in good faith to retain at least one bankruptcy attorney on affordable terms
  2. Meet certain financial eligibility standards
  3. Complete this application fully and accurately

  #### Financial Eligibility Guidelines

  - **Income**: Your total household income and benefits must be less than **150% of federal poverty guidelines** ([view current guidelines](https://aspe.hhs.gov/poverty-guidelines))
  - **Vehicles**: Up to $7,500 value per person
  - **Non-cash assets**: Up to $5,000 (individual) or $10,000 (married couple)
  - **Cash assets**: Up to $3,000 total (excluding retirement accounts)
  - **Retirement accounts**: Up to $10,000 (individual) or $20,000 (married couple)

  #### Important Notes

  - Your application will be signed under penalty of perjury
  - Referral to an attorney is not guaranteed, even if you qualify
  - The referred attorney may determine they cannot represent you or that Chapter 7 is not in your best interest
  - You remain responsible for any court filing fees and necessary expenses
continue button field: welcome
