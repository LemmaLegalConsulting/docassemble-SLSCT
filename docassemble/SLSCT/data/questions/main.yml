id: your address
question: |
  What is your address?
subquestion: |
  This is your current, physical address. Mailing address will be entered on another screen.
fields:
  - Street address: client.address.address
    address autocomplete: True
  - Address is a: client.address.address_type
    datatype: radio
    choices:
      - Apartment: apt
      - Suite: suite
      - Floor: floor
      - Other (including house): other
  - Apartment/Suite/Floor number: client.address.unit
    required: False
  - City or Town: client.address.city
  - State: client.address.state
    required: False
    code: |
      states_list(country_code=AL_DEFAULT_COUNTRY)
    default: ${ AL_DEFAULT_STATE }
  - ZIP: client.address.zip
  - Daytime Phone Number (optional): client.phone_number
    required: false
  - Mobile Telephone Number (optional): client.mobile_number
    required: false
  - Email address (optional): client.email
    required: false
---
id: your mailing address
question: |
  What is your mailing address?
fields:
  - Your mailing address is: client.mailing_address
    datatype: object_radio
    choices:
      - client.mailing_address if defined("client.mailing_address.address") else client.address if defined("client.address.address") else None
    object labeler: |
      lambda y: y.on_one_line()
    none of the above: |
      Somewhere else
    disable others: True
    show if:
      code: |
        defined("client.address.address")
    default: |
      client.address
  - ${ client.address.address_label }: client.mailing_address.address
    address autocomplete: True
  - Address is a: client.mailing_address.address_type
    datatype: radio
    choices:
      - Apartment: apt
      - Suite: suite
      - Floor: floor
      - Other (including house): other
  - Apartment/Suite/Floor number: client.mailing_address.unit
    required: False
  - ${ client.address.city_label }: client.mailing_address.city
  - ${ client.address.state_label }: client.mailing_address.state
    code: |
      states_list(country_code=AL_DEFAULT_COUNTRY)
    default: ${ AL_DEFAULT_STATE }
  - ${ client.address.zip_label }: client.mailing_address.zip
