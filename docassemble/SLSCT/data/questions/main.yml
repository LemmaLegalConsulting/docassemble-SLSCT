id: signatures
question: |
  ${ client.name.first }, please read and sign below:
subquestion: |
  I declare under the penalties of perjury that I have reviewed the Notice to All Parties Seeking Referral to Pro Bono Counsel For Chapter 7 Bankruptcy (the (“Notice”) and Application for Appointment of Attorney and that my answers to the foregoing questions are true and complete to the best of my knowledge. I understand that I have a continuing obligation to the Panel Administrator and any attorney to whom I have been referred to update them on any material changes to my income, benefits and/or assets that may affect my eligibility under this program.

  I understand that any attorney appointed is volunteering his or her time to help me and is not being paid by the court or government. I understand that if I am referred to an attorney and my attorney learns, either from me or elsewhere, that I can afford an attorney, my attorney may give that information to the Panel Administrator or the Court. If an attorney who may be referred to me determines that my application contains any inaccurate or incomplete information, I understand this is grounds for refusing to represent me and to terminate any representation, and that my failure to fully and accurately complete the application may be shared by the referred counsel to the Panel Administrator and/or the Court and such others as counsel may deem necessary in their discretion. I understand that any counsel to whom I am referred may decline to represent me for any reason, and, further, my referred counsel may deem it appropriate to seek to withdraw after appearing on my behalf and disclose information regarding my financial affairs at such attorney’s discretion.

  I understand and agree that the Connecticut Bar Association, the Connecticut Bar Association’s Commercial Law and Bankruptcy Section (including any individual member or subcommittee thereof), and any Panel Administrator (including any individual attorney serving as a member of the Panel Administrator) and Statewide Legal Services of CT, Inc. shall have no liability or responsibility to me for any appointment of pro bono counsel or any action or omission of pro bono counsel that is appointed or offered for my benefit, and that they shall NOT be responsible for supervising or monitoring Panel Attorneys and shall have no responsibility to any applicant or to any individual who has received or requested pro bono counsel assistance

  In each of the foregoing circumstances I hereby waive my privileges of attorney/client confidentiality to the extent necessary for my appointed attorney to disclose my financial affairs regarding my continuing eligibility or lack thereof under the criteria set forth in the Notice and under this pro bono program or to be relieved from representation as my counsel. I understand that my sending this application by way of electronic or email transmission, as signed and dated by me below, is legally binding on and enforceable against me.

signature: client.signature
under: |
  ${ client.name_full() }
required: False
