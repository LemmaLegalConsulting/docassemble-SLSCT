    "Accept": "application/json",
    "Authorization": f"Bearer {bearer_token}"
  }

  if task_not_yet_performed("submit custom fields"):
    response = requests.patch(url, json=payload, headers=headers, timeout=(3, 30))
    mark_task_as_performed("submit custom fields")

  try:
    response_json = response.json()
  except json.JSONDecodeError:
    response_json = {
        "error": True,
        "error_text": "Failed to decode JSON response from LegalServer",
    }
    log(f"Error decoding JSON response when submitting LegalServer: {response.text}")
  run_custom_fields_update = True
