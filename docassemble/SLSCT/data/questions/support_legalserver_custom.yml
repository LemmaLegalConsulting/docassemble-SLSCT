id: error
continue button field: api_error
question: |
  There was an error sending your information to Mid Missouri Legal Services
subquestion: |
  You can still continue to make an appointment with a staff person.

  You can mention this session ID to the staff person: `${ current_context().session }`
  and they may be able to retrieve your information.

  The specific error was:

  ```
  ${ response.text }
  ```
